# docker-compose.staging.no-mosquitto.yml — isolated external-broker staging.
#
# This variant does not join the maintainer staging broker's meshcore-net.
# Set MQTT_BROKER to an external broker reachable from the container.
# Compose fails during interpolation when MQTT_BROKER is unset.
#
# For maintainer staging, use docker-compose.staging.yml instead; it uses the
# operator-managed mqtt-broker attached to the external meshcore-net network.

services:
  staging-go:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: corescope-go:latest
    container_name: corescope-staging-go
    restart: unless-stopped
    stop_grace_period: 30s
    stop_signal: SIGTERM
    deploy:
      resources:
        limits:
          memory: 3g
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${STAGING_GO_HTTP_PORT:-82}:80"
      - "127.0.0.1:6060:6060"
      - "127.0.0.1:6061:6061"
    volumes:
      - ${STAGING_DATA_DIR:-~/meshcore-staging-data}:/app/data
      - caddy-data-staging-go:/data/caddy
    environment:
      - NODE_ENV=staging
      - ENABLE_PPROF=true
      - PPROF_HOST=0.0.0.0
      - SERVER_PPROF_PORT=6060
      - INGESTOR_PPROF_PORT=6061
      - DISABLE_MOSQUITTO=true
      - MQTT_BROKER=${MQTT_BROKER:?set MQTT_BROKER to an external broker URL}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  caddy-data-staging-go:
