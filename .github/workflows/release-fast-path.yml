name: Release Fast-Path

# A semver tag either reuses the already-tested :edge image when its revision
# matches the tag commit, or synchronously calls the full CI/CD pipeline. The
# release does not finish until its container path and binary assets succeed.
# This workflow is the sole consumer of push.tags; deploy.yml remains callable
# for the fallback but has no tag trigger of its own.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-fast-path-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retag-or-route:
    name: "🏷️ Re-tag :edge or select full pipeline"
    runs-on: ubuntu-latest
    outputs:
      fallback: ${{ steps.route.outputs.fallback }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Validate tag and inspect :edge revision
        id: route
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag does not match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          {
            echo "tag=$TAG"
            echo "v_major=v$MAJOR"
            echo "v_major_minor=v$MAJOR.$MINOR"
          } >> "$GITHUB_OUTPUT"

          OWNER="$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')"
          EDGE_REF="ghcr.io/${OWNER}/corescope:edge"
          if ! EDGE_DIGEST="$(crane digest "$EDGE_REF")"; then
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo ":edge not found — full pipeline required"
            exit 0
          fi
          if [[ ! "$EDGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid :edge digest returned by registry" >&2
            exit 1
          fi
          EDGE_REF_WITH_DIGEST="${EDGE_REF%:edge}@${EDGE_DIGEST}"
          if ! CONFIG="$(crane config "$EDGE_REF_WITH_DIGEST" 2>/dev/null)"; then
            echo "Unable to inspect resolved :edge digest" >&2
            exit 1
          fi
          printf 'edge_digest=%s\n' "$EDGE_DIGEST" >> "$GITHUB_OUTPUT"

          REV="$(printf '%s' "$CONFIG" | jq -r '.config.Labels["org.opencontainers.image.revision"] // ""')"
          if [[ ! "$REV" =~ ^[0-9a-f]{40}$ ]]; then
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo ":edge has no valid Git commit revision — full pipeline required"
            exit 0
          fi

          echo ":edge revision: $REV"
          echo "tag revision:   $TAG_SHA"
          if [[ "$REV" == "$TAG_SHA" ]]; then
            echo "fallback=false" >> "$GITHUB_OUTPUT"
          else
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-tag :edge as release (fast path)
        if: steps.route.outputs.fallback == 'false'
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          EDGE_DIGEST: ${{ steps.route.outputs.edge_digest }}
          RELEASE_TAG: ${{ steps.route.outputs.tag }}
          RELEASE_MAJOR_MINOR: ${{ steps.route.outputs.v_major_minor }}
          RELEASE_MAJOR: ${{ steps.route.outputs.v_major }}
        run: |
          set -euo pipefail
          OWNER="$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')"
          SRC="ghcr.io/${OWNER}/corescope@${EDGE_DIGEST}"
          for NEW_TAG in "$RELEASE_TAG" "$RELEASE_MAJOR_MINOR" "$RELEASE_MAJOR" latest; do
            echo "crane tag $SRC $NEW_TAG"
            crane tag "$SRC" "$NEW_TAG"
          done

  fallback-deploy:
    name: "🔄 Full validation and image build (fallback)"
    needs: retag-or-route
    if: needs.retag-or-route.outputs.fallback == 'true'
    uses: ./.github/workflows/deploy.yml

  release-artifacts:
    name: "📦 Release Artifacts"
    needs: [retag-or-route, fallback-deploy]
    if: >-
      always()
      && needs.retag-or-route.result == 'success'
      && (needs.retag-or-route.outputs.fallback == 'false'
          || needs.fallback-deploy.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go 1.22
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Build corescope-decrypt release binaries
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd cmd/decrypt
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.version=$RELEASE_VERSION" \
            -o ../../corescope-decrypt-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="-s -w -X main.version=$RELEASE_VERSION" \
            -o ../../corescope-decrypt-linux-arm64 .

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            corescope-decrypt-linux-amd64
            corescope-decrypt-linux-arm64
